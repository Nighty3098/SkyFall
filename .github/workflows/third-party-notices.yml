name: Update THIRD_PARTY_NOTICES

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses
          pip install -r requirements.txt

      - name: Generate THIRD_PARTY_NOTICES.md
        run: |
          pip-licenses --with-authors --with-urls --format=markdown > THIRD_PARTY_NOTICES.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo "No changes to THIRD_PARTY_NOTICES.md"
          else
            git commit -m "chore: update THIRD_PARTY_NOTICES.md"
            git push
          fi
