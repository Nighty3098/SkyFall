services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: always
    volumes:
      - ./searx/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
    networks:
      - skyfall_net

networks:
  skyfall_net:
    driver: bridge
