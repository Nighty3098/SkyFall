[project]
name = "SkyFall"

[tool.pyside6-project]
files = [
    "logger_setup.py",
    "main.py",
    "resources/Caveat-VariableFont_wght.ttf",
    "resources/IosevkaCharonMono-Regular.ttf",
    "resources/form.ui",
    "resources/style.template.qss",
    "src/connectors.py",
    "src/context_menus.py",
    "src/controllers/camera_inventory_controller.py",
    "src/controllers/domain_controller.py",
    "src/controllers/dorking_controller.py",
    "src/controllers/download_controller.py",
    "src/controllers/file_analyzer_controller.py",
    "src/controllers/intelx_controller.py",
    "src/controllers/settings_controller.py",
    "src/controllers/tg_analyzer_controller.py",
    "src/controllers/tg_downloader_controller.py",
    "src/controllers/username_search_controller.py",
    "src/modules/camera_inventory.py",
    "src/modules/domain_analyzer.py",
    "src/modules/dorks_search_engine.py",
    "src/modules/downloader.py",
    "src/modules/file_analyzer.py",
    "src/modules/google_dorks.py",
    "src/modules/intelx_search_engine.py",
    "src/modules/metadata_cleaner.py",
    "src/modules/tg/cache.py",
    "src/modules/tg/client_manager.py",
    "src/modules/tg/db.py",
    "src/modules/tg/extractors.py",
    "src/modules/tg/models.py",
    "src/modules/tg/proxy.py",
    "src/modules/tg/session_manager.py",
    "src/modules/tg/state.py",
    "src/modules/tg/throttler.py",
    "src/modules/tg/users.py",
    "src/modules/tg_analyzer.py",
    "src/modules/tg_downloader.py",
    "src/modules/system_proxy.py",
    "src/modules/username_search.py",
    "src/searxng_search.py",
    "src/shortcuts.py",
    "src/ui/drop_widget.py",
    "src/ui/horizontal_tab_style.py",
    "src/ui/setup_ui.py",
    "src/utils.py",
    "src/controllers/proxy_controller.py",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["resources/ui_form.py", "modules/", "scripts/", "thirdparty/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["N802"]
"src/libs/graph_lib.py" = ["N802", "N815"]
"src/ui/drop_widget.py" = ["N802"]
"src/modules/tg_analyzer.py" = ["E501"]
"src/modules/tg_downloader.py" = ["E501"]
"src/modules/tg/db.py" = ["E501"]
"src/modules/tg/models.py" = ["E501"]
"src/modules/maigret_search.py" = ["E501"]
"setup_telegram.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
