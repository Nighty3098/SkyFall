[project]
name = "SkyFall"

[tool.pyside6-project]
files = [
    "logger_setup.py",
    "main.py",
    "resources/Caveat-VariableFont_wght.ttf",
    "resources/IosevkaCharonMono-Regular.ttf",
    "resources/form.ui",
    "resources/style.qss",
    "resources/style_light.qss",
    "src/connectors.py",
    "src/context_menus.py",
    "src/controllers/domain_controller.py",
    "src/controllers/dorking_controller.py",
    "src/controllers/file_analyzer_controller.py",
    "src/controllers/intelx_controller.py",
    "src/controllers/settings_controller.py",
    "src/controllers/username_search_controller.py",
    "src/modules/domain_analyzer.py",
    "src/modules/dorks_search_engine.py",
    "src/modules/file_analyzer.py",
    "src/modules/google_dorks.py",
    "src/modules/intelx_search_engine.py",
    "src/modules/metadata_cleaner.py",
    "src/modules/username_search.py",
    "src/searxng_search.py",
    "src/shortcuts.py",
    "src/ui/drop_widget.py",
    "src/ui/horizontal_tab_style.py",
    "src/ui/setup_ui.py",
    "src/utils.py",
]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["resources/ui_form.py", "modules/", "scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["N802"]
"src/ui/drop_widget.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"
