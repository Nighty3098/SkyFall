[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["resources/ui_form.py", "modules/", "scripts/", "thirdparty/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["N802"]
"src/libs/graph_lib.py" = ["N802", "N815"]
"src/ui/drop_widget.py" = ["N802"]
"src/modules/tg_analyzer.py" = ["E501"]
"src/modules/tg_downloader.py" = ["E501"]
"src/modules/tg/db.py" = ["E501"]
"src/modules/tg/models.py" = ["E501"]
"src/modules/maigret_search.py" = ["E501"]
"setup_telegram.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
